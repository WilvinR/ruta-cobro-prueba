import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

const auth=getAuth(app),fs=getFirestore(app);let me=null;
function initials(n){const w=String(n||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z ]/g," ").trim().split(/\s+/).filter(Boolean);
 if(!w.length)return"XX";return(w.length>1?w[0][0]+w[1][0]:w[0].slice(0,2)).toUpperCase().padEnd(2,"X")}
async function newCode(name){const i=initials(name);
 for(let k=0;k<15;k++){const c="RC-"+i+(1000+Math.floor(Math.random()*9000)),r=doc(fs,"codes",c);
  if(!(await getDoc(r)).exists()){await setDoc(r,{t:1});return c}}
 throw new Error("code")}
window.FB={
 get me(){return me},
 onUser:cb=>onAuthStateChanged(auth,cb),
 signIn:()=>{const p=new GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});return signInWithPopup(auth,p).catch(e=>{if(e.code==="auth/popup-blocked")return signInWithRedirect(auth,p);throw e})},
 redirectResult:()=>getRedirectResult(auth),
 signOut:()=>{me=null;return signOut(auth)},
 refresh:async()=>{if(auth.currentUser)await window.FB.ready(auth.currentUser)},
 getConfig:async()=>{const s=await getDoc(doc(fs,"config","app"));return s.exists()?s.data():{}},
 get user(){return auth.currentUser},
 sendMessage:text=>addDoc(collection(fs,"mensajes"),{uid:auth.currentUser.uid,code:me.code,name:me.name,email:me.email,text,createdAt:serverTimestamp(),status:"nuevo"}),
 myMessages:async()=>{const r=await getDocs(query(collection(fs,"mensajes"),where("uid","==",auth.currentUser.uid)));
  return r.docs.map(d=>{const x=d.data();return{id:d.id,text:x.text,status:x.status,reply:x.reply||"",t:x.createdAt&&x.createdAt.toMillis?x.createdAt.toMillis():Date.now()}}).sort((a,b)=>b.t-a.t)},
 ready:async u=>{const ref=doc(fs,"users",u.uid);let s=await getDoc(ref);
  if(!s.exists()){const nm=u.displayName||(u.email||"").split("@")[0],c=await newCode(nm);
   await setDoc(ref,{name:nm,email:u.email||"",code:c,createdAt:serverTimestamp()});s=await getDoc(ref)}
  const d=s.data();["createdAt","paidUntil","exemptUntil"].forEach(k=>{if(d[k]&&d[k].toMillis)d[k]=d[k].toMillis()});me=d},
 loadData:async()=>{const s=await getDoc(doc(fs,"datos",auth.currentUser.uid));return s.exists()?s.data().json:null},
 saveData:j=>setDoc(doc(fs,"datos",auth.currentUser.uid),{json:j,updatedAt:serverTimestamp()})
};

<script>
"use strict";
const KEY="rutacobro_rd_v1",BKEY="rutacobro_rd_respaldo_previo";
const FREQ={diario:1,semanal:7,quincenal:15,mensual:30},FL={diario:"Diario",semanal:"Semanal",quincenal:"Quincenal",mensual:"Mensual"};
let db=empty(),view="hoy",q="",per="todo";
function empty(){return{clients:[],loans:[],payments:[],settings:{}}}
function valid(d){return d&&typeof d==="object"&&["clients","loans","payments"].every(k=>Array.isArray(d[k]))}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));return valid(d)?norm(d):empty()}catch(e){return empty()}}
let _st;function save(){if(typeof locked==="function"&&locked())return;clearTimeout(_st);_st=setTimeout(()=>{if(!window.FB)return;FB.saveData(JSON.stringify(db)).catch(()=>toast("No se pudo guardar. Revisa tu conexión"))},400)}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const $=s=>document.querySelector(s);
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const money=n=>"RD$"+(+n||0).toLocaleString("es-DO",{minimumFractionDigits:2,maximumFractionDigits:2});
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>iso(new Date());
const addDays=(s,n)=>{const[a,b,c]=s.split("-").map(Number),d=new Date(a,b-1,c+n);return iso(d)};
const lastDay=(y,m)=>new Date(y,m,0).getDate();
const ymd=(y,m,d)=>{if(m>12){y++;m=1}return y+"-"+pad(m)+"-"+pad(Math.min(d,lastDay(y,m)))};
const parts=s=>s.split("-").map(Number);
function nextQuin(s){const[y,m,d]=parts(s),b=Math.min(30,lastDay(y,m));return d<15?ymd(y,m,15):d<b?ymd(y,m,b):ymd(y,m+1,15)}
function nextMonth(s,dom){const[y,m,d]=parts(s);return ymd(y,m+1,dom||d)}
/* Siguiente cobro: semanal = mismo día de la semana; quincenal = días 15 y 30; mensual = mismo día del mes */
function advance(l,from){const f=from||l.nextDate;return l.freq==="diario"?addDays(f,1):l.freq==="semanal"?addDays(f,7):l.freq==="quincenal"?nextQuin(f):nextMonth(f,l.dom)}
function firstDue(freq,start,wd){
 if(freq==="diario")return addDays(start,1);
 if(freq==="semanal"){const[y,m,d]=parts(start),dow=new Date(y,m-1,d).getDay();return addDays(start,((wd-dow+7)%7)||7)}
 return freq==="quincenal"?nextQuin(start):nextMonth(start,parts(start)[2]);
}
const fdate=s=>s?s.split("-").reverse().join("/"):"-";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const client=id=>db.clients.find(c=>c.id===id),loan=id=>db.loans.find(l=>l.id===id);
const cname=id=>client(id)?.name||"(eliminado)";
const sum=(a,f)=>r2(a.reduce((s,x)=>s+f(x),0));
const active=()=>db.loans.filter(l=>!isDone(l));
const byDate=(a,b)=>a.nextDate.localeCompare(b.nextDate);
function status(l){if(isDone(l))return"Liquidado";const t=today();return l.nextDate<t?"Atrasado":l.nextDate===t?"Vence hoy":"Al día"}
const daysLate=l=>{const[a,b,c]=parts(l.nextDate),[x,y,z]=parts(today());return Math.max(Math.round((Date.UTC(x,y-1,z)-Date.UTC(a,b-1,c))/864e5),0)};
const tagL=l=>{const s=status(l);if(s!=="Atrasado")return tag(s);const n=daysLate(l);return`<span class="tag t-er">Atrasado ${n} ${n===1?"día":"días"}</span>`};
const tag=s=>`<span class="tag ${{"Al día":"t-ok","Vence hoy":"t-wn","Atrasado":"t-er","Liquidado":"t-mt"}[s]}">${s}</span>`;
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2500)}
function openModal(h){$("#md").innerHTML=h;$("#ov").classList.add("on")}
function closeModal(){$("#ov").classList.remove("on")}
function confirmBox(msg,ok,label){openModal(`<h2>Confirmar</h2><p>${msg}</p><div class="mf"><button class="btn g" data-close>Cancelar</button><button class="btn d" id="cok">${label}</button></div>`);$("#cok").onclick=()=>{closeModal();ok()}}

/* ===== LÓGICA ===== */
const EPS=0.005;
function inst(l,i){return i<l.n-1?l.cu:r2(l.total-l.cu*(l.n-1))}
const balance=l=>l.type==="c"?Math.max(r2(l.total-l.paid),0):l.principal;
const isDone=l=>l.type==="c"?l.total-l.paid<=EPS:l.principal<=EPS;
const capLeft=l=>l.type==="c"?Math.max(r2(l.capital-(l.capPaid||0)),0):l.principal;
const amountDue=l=>l.type==="c"?Math.max(r2(inst(l,Math.min(l.k,l.n-1))-l.credit),0):Math.max(r2(l.fee-(l.credit||0)),0);
const desc=l=>l.type==="c"?`${l.n} cuotas de ${money(inst(l,0))}`:`Rédito ${money(l.fee)}`;
/* Rédito: el rédito acordado se paga aparte; el capital solo baja con abonos */
function stepR(l,intr,cap){
 l.principal=r2(l.principal-cap);l.capPaid=r2((l.capPaid||0)+cap);l.credit=r2((l.credit||0)+intr);
 let g=0;while(l.fee>0&&l.principal>EPS&&l.credit+EPS>=l.fee&&g++<60){l.credit=r2(l.credit-l.fee);l.nextDate=advance(l)}
 if(l.principal<=EPS){l.principal=0;l.credit=0}else if(cap>0)l.fee=r2(l.principal*l.rate/100);
 return{interest:intr,capital:cap};
}
/* Cuotas: cada pago se reparte entre capital y ganancia en proporción a lo que queda */
function stepC(l,amt){
 const bal0=r2(l.total-l.paid),capL=Math.max(r2(l.capital-(l.capPaid||0)),0);let cap=bal0>0?r2(amt*capL/bal0):0;
 l.paid=r2(l.paid+amt);l.credit=r2(l.credit+amt);
 let g=0;while(l.k<l.n&&l.credit+EPS>=inst(l,l.k)&&g++<600){l.credit=r2(l.credit-inst(l,l.k));l.k++;l.nextDate=advance(l)}
 if(l.total-l.paid<=EPS){l.paid=l.total;l.k=l.n;l.credit=0;cap=capL}
 cap=Math.min(cap,capL);l.capPaid=r2((l.capPaid||0)+cap);
 return{interest:r2(amt-cap),capital:cap};
}
/* Cuotas, pago de rédito: pone al cliente al día (mueve la fecha) y NO baja lo que debe */
function stepCR(l,amt){
 l.rcredit=r2((l.rcredit||0)+amt);let g=0;
 while(l.gan>0&&l.rcredit+EPS>=l.gan&&g++<60){l.rcredit=r2(l.rcredit-l.gan);l.nextDate=advance(l)}
 return{interest:amt,capital:0};
}
/* Cuotas, avance a préstamo: baja lo que debe; la cuota se mantiene y la última queda más pequeña */
function stepA(l,amt){
 const bal0=r2(l.total-l.paid),capL=Math.max(r2(l.capital-(l.capPaid||0)),0);let cap=bal0>0?r2(amt*capL/bal0):0;
 l.total=r2(l.total-amt);
 if(l.total-l.paid<=EPS){l.total=l.paid;l.k=l.n;l.credit=0;cap=capL}
 else{const need=r2(l.total-l.paid+l.credit);l.n=l.k+Math.ceil(need/l.cu-1e-9)}
 cap=Math.min(cap,capL);l.capPaid=r2((l.capPaid||0)+cap);
 return{interest:r2(amt-cap),capital:cap};
}
function apply(l,i,c,kind){if(l.type!=="c")return stepR(l,i,c);return kind==="r"?stepCR(l,i):kind==="a"?stepA(l,i):stepC(l,i)}
function pay(l,date,intr,cap,note,kind){
 const r=apply(l,intr,cap,kind);
 const type=l.type==="c"?({r:"Rédito",a:"Avance a préstamo"}[kind]||"Cuota"):intr>0&&cap>0?"Mixto":cap>0?"Avance a préstamo":"Rédito";
 const p={id:uid(),loanId:l.id,clientId:l.clientId,date,interest:r.interest,capital:r.capital,type,note,bal:balance(l),next:isDone(l)?"":l.nextDate};
 if(l.type==="c"){p.k=l.k;p.n=l.n}
 db.payments.push(p);save();return p;
}
function newLoan(clientId,ln,note){

function editLoan(id){
 const l=loan(id),hasPay=db.payments.some(p=>p.loanId===id),isC=l.type==="c",curPct=isC?r2((l.total/l.capital-1)*100):0;
 openModal(`<h2>Editar préstamo</h2><p class="mt" style="margin-bottom:10px">${esc(cname(l.clientId))}</p>${hasPay?`<p class="mt" style="margin-bottom:10px;color:var(--wn)">Este préstamo ya tiene pagos. Lo ya pagado se mantiene y se recalcula lo que debe. El tipo de préstamo no se puede cambiar.</p>`:""}<form class="f" id="fm">${loanFields().replace("Primer cobro","Próximo cobro")}<div class="mf"><button type="button" class="btn g" data-close>Cancelar</button><button type="button" class="btn g" data-a="ver" data-id="${l.clientId}">Ver cliente</button><button class="btn">Guardar</button></div></form>`);
 const fm=$("#fm");
 fm.t.value=l.type;if(hasPay)fm.t.disabled=true;
 fm.cap.value=l.capital;
 if(isC){fm.pct.value=curPct;fm.n.value=l.n}else{fm.fee.value=l.fee;fm.rp.value=r2(l.fee/l.capital*100)}
 fm.freq.value=l.freq;fm.date.value=l.startDate||today();fm.wd.value=l.wd==null?5:l.wd;
 bindLoan(fm);
 fm.first.value=l.nextDate;fm.first.dispatchEvent(new Event("input",{bubbles:true}));
 fm.onsubmit=e=>{e.preventDefault();const o=readLoan(fm,true);if(!o)return;
  const same=o.t===l.type&&Math.abs(o.cap-l.capital)<EPS&&(isC?(o.n===l.n&&Math.abs(o.pct-curPct)<0.005):Math.abs(o.fee-l.fee)<EPS);
  if(!same){
   const prevPaid=isC&&o.t==="c"?(l.paid||0):0,prevCap=o.t===l.type?(l.capPaid||0):0;
   if(o.t==="c"){
    const total=r2(o.cap*(1+o.pct/100));
    if(prevPaid>total+EPS)return toast("El total ("+money(total)+") no puede ser menor que lo ya pagado ("+money(prevPaid)+")");
    Object.assign(l,{type:"c",capital:o.cap,pct:o.pct,n:o.n,total,cu:r2(total/o.n),gan:r2((total-o.cap)/o.n),paid:prevPaid,capPaid:Math.min(prevCap,o.cap),rcredit:l.rcredit||0,principal:0});
    delete l.fee;delete l.rate;
    let c=prevPaid,k=0;while(k<l.n&&c+EPS>=inst(l,k)&&k<600){c=r2(c-inst(l,k));k++}
    l.k=k;l.credit=c;
    if(l.total-l.paid<=EPS){l.paid=l.total;l.k=l.n;l.credit=0}
   }else{

    const principal=r2(o.cap-prevCap),keep=l.type==="r"?(l.credit||0):0;
    Object.assign(l,{type:"r",capital:o.cap,principal,fee:r2(o.fee),rate:o.fee/(principal>0?principal:o.cap)*100,capPaid:prevCap,credit:keep});
    ["n","total","cu","gan","paid","k","pct","rcredit"].forEach(x=>delete l[x]);
   }
  }
  l.freq=o.freq;l.startDate=o.date;l.nextDate=o.first;l.dom=parts(o.date)[2];l.wd=o.wd;
  save();closeModal();render();toast("Guardado")};

 <div class="f2"><div><label>Fecha</label><input name="date" type="date" value="${today()}"></div><div><label>Nota</label><input name="note" placeholder="Efectivo, parcial…"></div></div>
 <div class="live" id="lv"></div><div class="mf"><button type="button" class="btn g" data-close>Cancelar</button><button class="btn" id="sv">Guardar cobro</button></div></form>`);
 const fm=$("#fm"),kind=()=>fm.tp.value;
 const vals=()=>({i:num(fm.i.value),c:isC?0:num(fm.c.value)});
 const sim=()=>{const{i,c}=vals(),k=kind(),s={...l},ok=isFinite(i)&&isFinite(c)&&i>=0&&c>=0&&i+c>0&&(isC?(k==="r"?l.gan>0:i<=balance(l)+EPS):c<=l.principal+EPS);

const loadXL=()=>window.ExcelJS?Promise.resolve():new Promise((ok,no)=>{const x=document.createElement("script");x.src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js";x.onload=ok;x.onerror=no;document.head.appendChild(x)});
const xd=s=>{if(!s)return null;const[y,m,d]=parts(s);return new Date(y,m-1,d,12)};

async function exportar(){
 toast("Preparando Excel…");
 try{await loadXL()}catch(e){return toast("Necesitas internet para descargar la copia")}
 try{
  const wb=new ExcelJS.Workbook(),AR={name:"Arial",size:11},MON='"RD$"#,##0.00',DT="dd/mm/yyyy";
  const mk=(name,heads,widths)=>{const ws=wb.addWorksheet(name,{views:[{state:"frozen",ySplit:1}]});ws.columns=heads.map((h,i)=>({header:h,width:widths[i]}));const r=ws.getRow(1);r.height=32;
   r.eachCell(c=>{c.font={...AR,bold:true,color:{argb:"FFFFFFFF"}};c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FF1F3A5F"}};c.alignment={horizontal:"center",vertical:"middle",wrapText:true}});return ws};
  const finish=(ws,mc,dc,tot)=>ws.eachRow((r,i)=>{if(i===1)return;r.eachCell({includeEmpty:true},(c,col)=>{c.font={...AR,bold:i===tot};c.border={bottom:{style:"thin",color:{argb:"FFD0D7E2"}}};
    if(mc.includes(col))c.numFmt=MON;if(dc.includes(col)){c.numFmt=DT;c.alignment={horizontal:"center"}};if(i===tot)c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFE8EEF7"}}})});
  const byName=(a,b)=>cname(a.clientId).localeCompare(cname(b.clientId),"es");
  /* Clientes */
  const wc=mk("Clientes",["Cliente","Teléfono","Dirección / referencia","Total prestado","Debe","Ganancia cobrada","Estado"],[22,16,26,16,16,18,18]);
  const cs=[...db.clients].sort((a,b)=>a.name.localeCompare(b.name,"es"));
  cs.forEach(c=>{const ls=db.loans.filter(l=>l.clientId===c.id),ps=db.payments.filter(p=>p.clientId===c.id),act=ls.filter(l=>!isDone(l));
   const lt=act.filter(l=>status(l)==="Atrasado").sort((a,b)=>daysLate(b)-daysLate(a))[0];
   const est=!ls.length?"Sin préstamos":!act.length?"Liquidado":lt?estadoTxt(lt):act.some(l=>status(l)==="Vence hoy")?"Vence hoy":"Al día";
   wc.addRow([c.name,c.phone||"",c.ref||"",sum(ls,l=>l.capital),sum(ls,balance),sum(ps,p=>p.interest),est])});
  let tot=0;if(cs.length){const n=cs.length+1,col=k=>({formula:`SUM(${k}2:${k}${n})`,result:sum(wc.getRows(2,cs.length).map(r=>({v:r.getCell(k).value})),x=>x.v)});
   wc.addRow(["TOTAL","","",col("D"),col("E"),col("F"),""]);tot=n+1}
  finish(wc,[4,5,6],[],tot);
  /* Préstamos */
  const wl=mk("Préstamos",["Cliente","Tipo","Monto prestado","Condiciones","Cobro","Fecha de entrega","Próximo cobro","Total cobrado","Debe","Estado"],[22,12,16,26,12,16,16,16,16,18]);
  [...db.loans].sort(byName).forEach(l=>wl.addRow([cname(l.clientId),l.type==="c"?"A cuotas":"A rédito",l.capital,desc(l),FL[l.freq],xd(l.startDate),isDone(l)?null:xd(l.nextDate),sum(db.payments.filter(p=>p.loanId===l.id),p=>p.interest+p.capital),balance(l),estadoTxt(l)]));
  finish(wl,[3,8,9],[6,7],0);
  /* Pagos */
  const wp=mk("Pagos",["Fecha","Cliente","Concepto","Capital","Ganancia","Total"],[14,22,34,16,16,16]);
  const pg=[...db.payments].sort((a,b)=>b.date.localeCompare(a.date));
  pg.forEach((p,i)=>{const r=i+2;wp.addRow([xd(p.date),cname(p.clientId),concept(p),p.capital,p.interest,{formula:`D${r}+E${r}`,result:r2(p.capital+p.interest)}])});
  tot=0;if(pg.length){const n=pg.length+1;wp.addRow(["TOTAL","","",{formula:`SUM(D2:D${n})`,result:sum(pg,p=>p.capital)},{formula:`SUM(E2:E${n})`,result:sum(pg,p=>p.interest)},{formula:`SUM(F2:F${n})`,result:sum(pg,p=>p.capital+p.interest)}]);tot=n+1}
  finish(wp,[4,5,6],[1],tot);
  const buf=await wb.xlsx.writeBuffer(),a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
  a.download=`RutaCobro_Respaldo_${today()}.xlsx`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast("Copia de seguridad descargada");
 }catch(e){toast("No se pudo crear el Excel")}
}

function mem(){const m=(window.FB&&FB.me)||{},n=Date.now(),c=m.createdAt||n,dl=x=>Math.max(1,Math.ceil((x-n)/DAY));

 if(n<t)return{s:"trial",d:dl(t)};
 if(p&&n<p+5*DAY)return{s:"grace",d:dl(p+5*DAY)};
 return{s:"locked"}}

 else if(m.s==="grace"){t="Membresía vencida. Te quedan "+dd(m.d)+" para renovar";c="er"}

 else return"";
