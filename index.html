<style>

in-top:13px}.custom-days-selected b{color:var(--tx);font-weight:600}.custom-days-footer{display:flex;justify-content:flex-end;margin-top:14px}.custom-days-footer .btn{min-width:92px}

.vtabs{display:flex;gap:4px;background:rgba(9,17,31,.58);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:3px;margin:16px 0 10px}

}

.mb{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--bl);background:#0b1730;border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:14.5px}.announcement{position:relative;background:linear-gradient(135deg,rgba(47,123,255,.18),rgba(9,17,31,.96));border:1px solid var(--ce);border-radius:14px;padding:13px 48px 13px 14px;margin-bottom:12px;box-shadow:0 8px 24px rgba(0,0,0,.24)}.announcement .at{font-weight:700;font-size:15px;margin-bottom:4px}.announcement .am{font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.announcement .ax{position:absolute;top:9px;right:9px;width:31px;height:31px;border:0;border-radius:50%;background:var(--er);color:#fff;font-size:20px;line-height:1;cursor:pointer}.announcement .ax:active{transform:scale(.94)}

a.btn{display:inline-block;text-decoration:none;text-align:center}

<body>
<header><div class="wrap"><div class="brand" id="brand"></div><nav id="nav"></nav></div></header>
<main class="wrap" id="app"></main>
<div class="ov" id="ov"><div class="md" id="md"></div></div>
<input type="file" id="file" accept=".json,application/json" hidden>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,collection,addDoc,query,where,getDocs,doc,getDoc,setDoc,updateDoc,deleteDoc,writeBatch,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyBIUEHtcuhPv3EmohKJtZ2FXsm6OsNQscY",authDomain:"rutacobrord.firebaseapp.com",projectId:"rutacobrord",storageBucket:"rutacobrord.firebasestorage.app",messagingSenderId:"626570456246",appId:"1:626570456246:web:6931e4e3f320c15e378a17"});
const auth=getAuth(app),fs=getFirestore(app);let me=null;
/* Contadores de uso (solo números): clientes, préstamos activos, nuevos por día y último movimiento */
const doneL=l=>l.type==="c"?(l.total-l.paid<=0.005):(l.principal<=0.005);
const dkey=t=>{const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
function prune(d){const o={},lim=dkey(Date.now()-31*864e5);Object.keys(d||{}).forEach(k=>{if(k>=lim&&Array.isArray(d[k]))o[k]=d[k]});return o}
async function pushStats(st){try{await updateDoc(doc(fs,"users",auth.currentUser.uid),{stats:st});if(me)me.stats=st}catch(e){}}
function syncStats(C,L,P){try{const act=L.filter(l=>l&&!doneL(l)).length,s=me&&me.stats;
 if(s&&s.c===C.length&&s.l===act)return;
 let m=(s&&s.m)||0;
 if(!s){const now=Date.now();[...P.map(p=>p&&p.date),...L.map(l=>l&&l.startDate)].forEach(x=>{const t=x?new Date(x+"T12:00:00").getTime():0;if(t&&t<=now&&t>m)m=t})}
 pushStats({c:C.length,l:act,m,d:prune(s&&s.d)})}catch(e){}}
function initials(n){const w=String(n||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z ]/g," ").trim().split(/\s+/).filter(Boolean);
 if(!w.length)return"XX";return(w.length>1?w[0][0]+w[1][0]:w[0].slice(0,2)).toUpperCase().padEnd(2,"X")}
async function newCode(name){const i=initials(name);
 for(let k=0;k<15;k++){const c="RC-"+i+(1000+Math.floor(Math.random()*9000)),r=doc(fs,"codes",c);
  if(!(await getDoc(r)).exists()){await setDoc(r,{t:1});return c}}
 throw new Error("code")}
window.FB={
 get me(){return me},
 onUser:cb=>onAuthStateChanged(auth,cb),
 signIn:()=>{const p=new GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});return signInWithPopup(auth,p).catch(e=>{if(e.code==="auth/popup-blocked")return signInWithRedirect(auth,p);throw e})},
 redirectResult:()=>getRedirectResult(auth),
 signOut:()=>{me=null;return signOut(auth)},
 refresh:async()=>{if(auth.currentUser)await window.FB.ready(auth.currentUser)},
 getConfig:async()=>{const s=await getDoc(doc(fs,"config","app"));return s.exists()?s.data():{}}, dismissAnnouncement:async id=>{if(!id||!auth.currentUser)return;await setDoc(doc(fs,"users",auth.currentUser.uid),{announcementSeen:id},{merge:true});if(me)me.announcementSeen=id},
 get user(){return auth.currentUser},
 setPending:(plan,amount)=>{me.pending=true;return setDoc(doc(fs,"pendientes",auth.currentUser.uid),{uid:auth.currentUser.uid,code:me.code,name:me.name,plan,amount,sentAt:serverTimestamp()})},
 sendMessage:text=>addDoc(collection(fs,"mensajes"),{uid:auth.currentUser.uid,code:me.code,name:me.name,email:me.email,text,createdAt:serverTimestamp(),status:"nuevo"}),
 myMessages:async()=>{const r=await getDocs(query(collection(fs,"mensajes"),where("uid","==",auth.currentUser.uid)));
  return r.docs.map(d=>{const x=d.data();return{id:d.id,text:x.text,status:x.status,reply:x.reply||"",t:x.createdAt&&x.createdAt.toMillis?x.createdAt.toMillis():Date.now()}}).sort((a,b)=>b.t-a.t)},
 ready:async u=>{const ref=doc(fs,"users",u.uid);let s=await getDoc(ref);
  if(!s.exists()){const nm=u.displayName||(u.email||"").split("@")[0],c=await newCode(nm);
   await setDoc(ref,{name:nm,email:u.email||"",code:c,createdAt:serverTimestamp()});s=await getDoc(ref)}
  const d=s.data();["createdAt","paidUntil","exemptUntil"].forEach(k=>{if(d[k]&&d[k].toMillis)d[k]=d[k].toMillis()});try{d.pending=(await getDoc(doc(fs,"pendientes",u.uid))).exists()}catch(e){d.pending=false}me=d},
 migrateLegacy:async()=>{
  const uid=auth.currentUser.uid,base=doc(fs,"datos",uid),legacy=await getDoc(base);
  if(!legacy.exists()||typeof legacy.data().json!=="string")return false;
  let d;try{d=JSON.parse(legacy.data().json)}catch(e){return false}
  if(!d||!Array.isArray(d.clients)||!Array.isArray(d.loans)||!Array.isArray(d.payments))return false;
  const groups=[d.clients.map(x=>["clientes",x]),d.loans.map(x=>["prestamos",x]),d.payments.map(x=>["pagos",x])];
  let batch=writeBatch(fs),n=0;
  for(const group of groups)for(const [col,x] of group){if(!x||!x.id)continue;batch.set(doc(fs,"datos",uid,col,x.id),x);if(++n===450){await batch.commit();batch=writeBatch(fs);n=0}}
  if(n)await batch.commit();
  await setDoc(doc(fs,"datos",uid,"meta","main"),{version:2,migratedAt:serverTimestamp()},{merge:true});
  await deleteDoc(base);
  return true;
 },
 loadData:async()=>{
  const uid=auth.currentUser.uid,base=doc(fs,"datos",uid);
  const [cs,ls,ps]=await Promise.all([
   getDocs(collection(fs,"datos",uid,"clientes")),
   getDocs(collection(fs,"datos",uid,"prestamos")),
   getDocs(collection(fs,"datos",uid,"pagos"))
  ]);
  if(!cs.empty||!ls.empty||!ps.empty){const C=cs.docs.map(d=>d.data()),L=ls.docs.map(d=>d.data()),P=ps.docs.map(d=>d.data());syncStats(C,L,P);return JSON.stringify({clients:C,loans:L,payments:P,settings:{}})}
  const legacy=await getDoc(base);
  if(legacy.exists()&&legacy.data().json){await window.FB.migrateLegacy();return window.FB.loadData()}
  return null;
 },
 saveData:async j=>{
  const uid=auth.currentUser.uid,d=JSON.parse(j),groups={clientes:d.clients||[],prestamos:d.loans||[],pagos:d.payments||[]};
  const existing={};
  for(const col of Object.keys(groups)){const r=await getDocs(collection(fs,"datos",uid,col));existing[col]=new Map(r.docs.map(x=>[x.id,x.data()]));}
  const ops=[];
  const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
  for(const [col,arr] of Object.entries(groups)){
   const next=new Map((arr||[]).filter(x=>x&&x.id).map(x=>[x.id,x]));
   for(const [id,x] of next){if(!existing[col].has(id)||!same(existing[col].get(id),x))ops.push({t:"set",ref:doc(fs,"datos",uid,col,id),data:x});}
   for(const id of existing[col].keys())if(!next.has(id))ops.push({t:"del",ref:doc(fs,"datos",uid,col,id)});
  }
  ops.push({t:"set",ref:doc(fs,"datos",uid,"meta","main"),data:{version:2,updatedAt:serverTimestamp()},merge:true});
  for(let i=0;i<ops.length;i+=450){const b=writeBatch(fs);for(const o of ops.slice(i,i+450))o.t==="del"?b.delete(o.ref):b.set(o.ref,o.data,o.merge?{merge:true}:undefined);await b.commit()}
  try{
   const cnt=col=>[...new Set((groups[col]||[]).filter(x=>x&&x.id).map(x=>x.id))].filter(id=>!existing[col].has(id)).length;
   const nC=cnt("clientes"),nL=cnt("prestamos"),nP=cnt("pagos"),cT=new Set((d.clients||[]).filter(x=>x&&x.id).map(x=>x.id)).size,act=(d.loans||[]).filter(l=>l&&l.id&&!doneL(l)).length;
   const s=(me&&me.stats)||{},dd=prune(s.d),k=dkey(Date.now()),mv=(nC||nL||nP)?Date.now():(s.m||0);
   if(nC||nL||nP){const x=dd[k]||[0,0,0];dd[k]=[x[0]+nC,x[1]+nL,x[2]+nP]}
   if(s.c!==cT||s.l!==act||nC||nL||nP)await pushStats({c:cT,l:act,m:mv,d:dd});
  }catch(e){}
 }
};
window.dispatchEvent(new Event("fb-ready"));

<script>
"use strict";
const KEY="rutacobro_rd_v1",BKEY="rutacobro_rd_respaldo_previo";
const FREQ={diario:1,semanal:7,quincenal:15,mensual:30,personalizado:0},FL={diario:"Diario",semanal:"Semanal",quincenal:"Quincenal",mensual:"Mensual",personalizado:"Personalizado"};
let db=empty(),view="hoy",q="",per="todo",rp="y"+new Date().getFullYear(),rd1="",rd2="",hp="todo",hd1="",hd2="",hn=80,_hist=[],_ho=null;
function empty(){return{clients:[],loans:[],payments:[],settings:{}}}
function valid(d){return d&&typeof d==="object"&&["clients","loans","payments"].every(k=>Array.isArray(d[k]))}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));return valid(d)?norm(d):empty()}catch(e){return empty()}}
let _st;function save(){if(typeof locked==="function"&&locked())return;clearTimeout(_st);_st=setTimeout(()=>{if(!window.FB)return;FB.saveData(JSON.stringify(db)).catch(()=>toast("No se pudo guardar. Revisa tu conexión"))},400)}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const $=s=>document.querySelector(s);
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const money=n=>"RD$"+(+n||0).toLocaleString("es-DO",{minimumFractionDigits:2,maximumFractionDigits:2});
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>iso(new Date());
const addDays=(s,n)=>{const[a,b,c]=s.split("-").map(Number),d=new Date(a,b-1,c+n);return iso(d)};
const lastDay=(y,m)=>new Date(y,m,0).getDate();
const ymd=(y,m,d)=>{if(m>12){y++;m=1}return y+"-"+pad(m)+"-"+pad(Math.min(d,lastDay(y,m)))};
const parts=s=>s.split("-").map(Number);
function nextQuin(s){const[y,m,d]=parts(s),b=Math.min(30,lastDay(y,m));return d<15?ymd(y,m,15):d<b?ymd(y,m,b):ymd(y,m+1,15)}
function nextMonth(s,dom){const[y,m,d]=parts(s);return ymd(y,m+1,dom||d)}
/* Siguiente cobro: semanal = mismo día de la semana; quincenal = días 15 y 30; mensual = mismo día del mes */
function customDays(l){return Array.isArray(l.customDays)?l.customDays.map(Number).filter(d=>d>=1&&d<=31).sort((a,b)=>a-b):[]}
function nextCustom(s,days){const ds=[...new Set((days||[]).map(Number).filter(d=>d>=1&&d<=31))].sort((a,b)=>a-b);if(!ds.length)return addDays(s,1);const[y,m,d]=parts(s);for(let off=1;off<=62;off++){const z=new Date(y,m-1,d+off),day=Math.min(z.getDate(),lastDay(z.getFullYear(),z.getMonth()+1));if(ds.includes(day))return iso(z)}return addDays(s,1)}
function advance(l,from){const f=from||l.nextDate;return l.freq==="diario"?addDays(f,1):l.freq==="semanal"?addDays(f,7):l.freq==="quincenal"?nextQuin(f):l.freq==="personalizado"?nextCustom(f,customDays(l)):nextMonth(f,l.dom)}
function firstDue(freq,start,wd,days){
 if(freq==="diario")return addDays(start,1);
 if(freq==="semanal"){const[y,m,d]=parts(start),dow=new Date(y,m-1,d).getDay();return addDays(start,((wd-dow+7)%7)||7)}
 if(freq==="quincenal")return nextQuin(start);
 if(freq==="personalizado")return nextCustom(start,days);
 return nextMonth(start,parts(start)[2]);
}
const fdate=s=>s?s.split("-").reverse().join("/"):"-";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const client=id=>db.clients.find(c=>c.id===id),loan=id=>db.loans.find(l=>l.id===id);
const cname=id=>client(id)?.name||"(eliminado)";
const sum=(a,f)=>r2(a.reduce((s,x)=>s+f(x),0));
const active=()=>db.loans.filter(l=>!l.renewed&&!isDone(l));
const byDate=(a,b)=>a.nextDate.localeCompare(b.nextDate);
function status(l){if(isDone(l))return"Liquidado";const t=today();return l.nextDate<t?"Atrasado":l.nextDate===t?"Vence hoy":"Al día"}
const daysLate=l=>{const[a,b,c]=parts(l.nextDate),[x,y,z]=parts(today());return Math.max(Math.round((Date.UTC(x,y-1,z)-Date.UTC(a,b-1,c))/864e5),0)};
const tagL=l=>{const s=status(l);if(s!=="Atrasado")return tag(s);const n=daysLate(l);return`<span class="tag t-er">Atrasado ${n} ${n===1?"día":"días"}</span>`};
const tag=s=>`<span class="tag ${{"Al día":"t-ok","Vence hoy":"t-wn","Atrasado":"t-er","Liquidado":"t-mt"}[s]}">${s}</span>`;
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2500)}
function openModal(h){$("#md").innerHTML=h;$("#ov").classList.add("on")}
function closeModal(){$("#ov").classList.remove("on")}
function confirmBox(msg,ok,label){openModal(`<h2>Confirmar</h2><p>${msg}</p><div class="mf"><button class="btn g" data-close>Cancelar</button><button class="btn d" id="cok">${label}</button></div>`);$("#cok").onclick=()=>{closeModal();ok()}}

/* ===== LÓGICA ===== */
const EPS=0.005;
function inst(l,i){return i<l.n-1?l.cu:r2(l.total-l.cu*(l.n-1))}
const balance=l=>l.type==="c"?Math.max(r2(l.total-l.paid),0):l.principal;
const isDone=l=>l.type==="c"?l.total-l.paid<=EPS:l.principal<=EPS;
const capLeft=l=>l.type==="c"?Math.max(r2(l.capital-(l.capPaid||0)),0):l.principal;
const amountDue=l=>l.type==="c"?Math.max(r2(inst(l,Math.min(l.k,l.n-1))-l.credit),0):Math.max(r2(l.fee-(l.credit||0)),0);
const desc=l=>l.type==="c"?`${l.n} cuotas de ${money(inst(l,0))}`:`Rédito ${money(l.fee)}`;
/* Rédito: el rédito acordado se paga aparte; el capital solo baja con abonos */
function stepR(l,intr,cap){
 l.principal=r2(l.principal-cap);l.capPaid=r2((l.capPaid||0)+cap);l.credit=r2((l.credit||0)+intr);
 let g=0;while(l.fee>0&&l.principal>EPS&&l.credit+EPS>=l.fee&&g++<60){l.credit=r2(l.credit-l.fee);l.nextDate=advance(l)}
 if(l.principal<=EPS){l.principal=0;l.credit=0}else if(cap>0)l.fee=r2(l.principal*l.rate/100);
 return{interest:intr,capital:cap};
}
/* Cuotas: cada pago se reparte entre capital y ganancia en proporción a lo que queda */
function stepC(l,amt){
 const bal0=r2(l.total-l.paid),capL=Math.max(r2(l.capital-(l.capPaid||0)),0);let cap=bal0>0?r2(amt*capL/bal0):0;
 l.paid=r2(l.paid+amt);l.credit=r2(l.credit+amt);
 let g=0;while(l.k<l.n&&l.credit+EPS>=inst(l,l.k)&&g++<600){l.credit=r2(l.credit-inst(l,l.k));l.k++;l.nextDate=advance(l)}
 if(l.total-l.paid<=EPS){l.paid=l.total;l.k=l.n;l.credit=0;cap=capL}
 cap=Math.min(cap,capL);l.capPaid=r2((l.capPaid||0)+cap);
 return{interest:r2(amt-cap),capital:cap};
}
/* Cuotas, pago de rédito: pone al cliente al día (mueve la fecha) y NO baja lo que debe */
function stepCR(l,amt){
 l.rcredit=r2((l.rcredit||0)+amt);let g=0;
 while(l.gan>0&&l.rcredit+EPS>=l.gan&&g++<60){l.rcredit=r2(l.rcredit-l.gan);l.nextDate=advance(l)}
 return{interest:amt,capital:0};
}
/* Cuotas, avance a préstamo: baja lo que debe; la cuota se mantiene y la última queda más pequeña */
function stepA(l,amt){
 const bal0=r2(l.total-l.paid),capL=Math.max(r2(l.capital-(l.capPaid||0)),0);let cap=bal0>0?r2(amt*capL/bal0):0;
 l.total=r2(l.total-amt);
 if(l.total-l.paid<=EPS){l.total=l.paid;l.k=l.n;l.credit=0;cap=capL}
 else{const need=r2(l.total-l.paid+l.credit);l.n=l.k+Math.ceil(need/l.cu-1e-9)}
 cap=Math.min(cap,capL);l.capPaid=r2((l.capPaid||0)+cap);
 return{interest:r2(amt-cap),capital:cap};
}
function apply(l,i,c,kind){if(l.type!=="c")return stepR(l,i,c);return kind==="r"?stepCR(l,i):kind==="a"?stepA(l,i):stepC(l,i)}
function pay(l,date,intr,cap,note,kind){
 const r=apply(l,intr,cap,kind);
 const type=l.type==="c"?({r:"Rédito",a:"Avance a préstamo"}[kind]||"Cuota"):intr>0&&cap>0?"Mixto":cap>0?"Avance a préstamo":"Rédito";
 const p={id:uid(),loanId:l.id,clientId:l.clientId,date,interest:r.interest,capital:r.capital,type,note,bal:balance(l),next:isDone(l)?"":l.nextDate};
 if(l.type==="c"){p.k=l.k;p.n=l.n}
 db.payments.push(p);save();return p;
}
function newLoan(clientId,ln,note){
 const o={id:uid(),clientId,type:ln.t,capital:r2(ln.cap),initialCapital:r2(ln.cap),freq:ln.freq,startDate:ln.date,nextDate:ln.first||firstDue(ln.freq,ln.date,ln.wd==null?5:ln.wd,ln.customDays||[]),dom:parts(ln.date)[2],wd:ln.wd==null?5:ln.wd,customDays:Array.isArray(ln.customDays)?ln.customDays:[],note:note||"",credit:0,capPaid:0};
 if(ln.t==="c"){const total=r2(ln.cap*(1+ln.pct/100));Object.assign(o,{pct:ln.pct,n:ln.n,total,cu:r2(total/ln.n),gan:r2((total-ln.cap)/ln.n),rcredit:0,paid:0,k:0,principal:0})}
 else Object.assign(o,{principal:r2(ln.cap),fee:r2(ln.fee),rate:ln.fee/ln.cap*100});
 db.loans.push(o);
}
function norm(d){d.loans.forEach(l=>{if(l.initialCapital==null)l.initialCapital=r2(l.capital||0);if(!l.type){l.type="r";l.fee=r2(l.principal*l.rate/100);l.credit=0;l.capPaid=r2((l.capital||0)-l.principal)}if(l.type==="c"){if(!l.cu)l.cu=r2(l.total/l.n);if(l.gan==null)l.gan=r2((l.total-l.capital)/l.n);l.rcredit=l.rcredit||0}});d.settings=d.settings||{};return d}
function inPer(d){const t=today();if(per==="hoy")return d===t;if(per==="semana"){const n=new Date(),k=(n.getDay()+6)%7;return d>=addDays(t,-k)&&d<=t}if(per==="mes")return d.slice(0,7)===t.slice(0,7);return true}

/* ===== PANTALLAS ===== */
const loanRow=l=>`<div class="it${status(l)==='Atrasado'?' late':''}" data-a="editLoan" data-id="${l.id}"><div class="grow"><div class="nm">${esc(cname(l.clientId))}</div><div class="mt">Debe ${money(balance(l))} · ${l.type==="c"?`Pagadas ${Math.min(l.k,l.n)} de ${l.n}`:"Rédito"} ${money(amountDue(l))}</div><div class="mt">${fdate(l.nextDate)} ${tagL(l)}</div></div><button class="btn s" data-a="cobrar" data-id="${l.id}">Cobrar</button></div>`;
const emptyBox=(m)=>`<div class="empty">${m}<br><button class="btn" data-a="nuevoCliente">Agregar cliente</button></div>`;
function histRange(){const t=today();let f=null,h=null;
 if(hp==="hoy"){f=h=t}
 else if(hp==="semana"){const k=(new Date().getDay()+6)%7;f=addDays(t,-k);h=t}
 else if(hp==="mes"){f=t.slice(0,7)+"-01";h=t.slice(0,7)+"-31"}
 else if(/^y\d{4}$/.test(hp)){f=hp.slice(1)+"-01-01";h=hp.slice(1)+"-12-31"}
 else if(hp==="rango"){f=hd1||"0000-01-01";h=hd2||"9999-12-31";if(f>h){const x=f;f=h;h=x}}
 return{f,h}}
function histRow(p){return`<div class="it"><div class="grow"><div class="nm" style="cursor:default">${esc(cname(p.clientId))}</div><div class="mt">${fdate(p.date)} · ${concept(p)}${p.renewal?" · Nuevo préstamo "+money(p.renewalAmount||0)+" · Entregado "+money(p.investment||0):p.note?" · "+esc(p.note):""}</div></div><div style="text-align:right"><b>${money(p.interest+p.capital)}</b><div class="mt">Capital ${money(p.capital)}</div><div class="mt" style="color:var(--ok)">Ganancia ${money(p.interest)}</div></div></div>`}
function setupHist(){
 if(_ho){_ho.disconnect();_ho=null}
 const sn=$("#hs");if(!sn||!window.IntersectionObserver)return;
 _ho=new IntersectionObserver(es=>{
  if(!es.some(e=>e.isIntersecting))return;
  _ho.disconnect();_ho=null;
  setTimeout(()=>{const l=$("#hl"),s2=$("#hs");if(!l||!s2||view!=="historial")return;
   const n=Math.min(hn+80,_hist.length);
   l.insertAdjacentHTML("beforeend",_hist.slice(hn,n).map(histRow).join(""));hn=n;
   if(hn>=_hist.length)s2.remove();else setupHist()},150)
 },{rootMargin:"400px"});
 _ho.observe(sn)}
function fitKpi(){document.querySelectorAll(".grid.kpi .v").forEach(v=>{v.style.fontSize="";let z=16;while(v.scrollWidth>v.clientWidth+1&&z>10){z-=.5;v.style.fontSize=z+"px"}})}
function capAlert(){const l=document.querySelector(".alert .movements-list");if(!l)return;l.style.maxHeight="none";const k=[...l.children];if(k.length<=5)return;let h=0;for(let i=0;i<5;i++)h+=k[i].offsetHeight;l.style.maxHeight=h+"px"}
function afterRender(){fitKpi();capAlert();if(view==="historial")setupHist();else if(_ho){_ho.disconnect();_ho=null}}
window.addEventListener("resize",()=>{if(view==="hoy")fitKpi()});
const VIEWS={
hoy(){
 const t=today(),act=active().sort(byDate),d=act.filter(l=>l.nextDate<=t),f=act.filter(l=>l.nextDate>t);
 const cob=sum(db.payments.filter(p=>p.date===t),p=>p.interest+p.capital);
 const late=act.filter(l=>l.nextDate<t),banner=late.length?`<div class="alert"><b>⚠ ${late.length} ${late.length===1?"cliente atrasado":"clientes atrasados"}</b><div class="mt" style="color:var(--er)">Vencido por cobrar: ${money(sum(late,amountDue))}</div><div class="movements-list">${late.map(l=>`<div class="it" data-a="editLoan" data-id="${l.id}"><div class="grow"><div class="nm">${esc(cname(l.clientId))}</div><div class="mt">Debía pagar el ${fdate(l.nextDate)}</div></div><div style="text-align:right"><b>${money(amountDue(l))}</b><div class="mt" style="color:var(--er)">${daysLate(l)} ${daysLate(l)===1?"día":"días"} tarde</div></div></div>`).join("")}</div></div>`:"";
 return`<div class="grid kpi"><div class="card"><div class="l">Por cobrar hoy</div><div class="v" style="color:var(--wn)">${money(sum(d,amountDue))}</div></div><div class="card"><div class="l">Cobrado hoy</div><div class="v" style="color:var(--ok)">${money(cob)}</div></div><div class="card"><div class="l">Atrasados</div><div class="v" style="color:var(--er)">${act.filter(l=>l.nextDate<t).length}</div></div><div class="card"><div class="l">Dinero en la calle</div><div class="v">${money(sum(act,capLeft))}</div></div></div>${banner}
 <div class="card"><h2>Cobros de hoy</h2>${d.length?`<div class="movements-list">${d.map(loanRow).join("")}</div>`:(act.length?`<div class="empty">No tienes cobros pendientes hoy.</div>`:emptyBox("Aún no tienes clientes."))}</div>
 ${f.length?`<div class="card"><h2>Próximos cobros</h2><div class="movements-list">${f.map(loanRow).join("")}</div></div>`:""}`;
},
clientes(){
 const s=q.toLowerCase(),list=db.clients.filter(c=>c.name.toLowerCase().includes(s)||(c.phone||"").includes(s));
 const rows=list.map(c=>{
  const ls=active().filter(l=>l.clientId===c.id).sort(byDate),debt=sum(ls,balance),next=ls[0],late=ls.some(l=>status(l)==="Atrasado");

 if(n<p)return{s:"paid",d:dl(p),u:p};
 if(n<t)return{s:"trial",d:dl(t)};
 if(p&&n<p+5*DAY)return{s:"grace",d:dl(p+5*DAY)};
